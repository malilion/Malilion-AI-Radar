name: Update news

on:
  schedule:
    - cron: "0 * * * *"   # 每小時整點執行一次
  workflow_dispatch:
  push:
    branches: [main]
  # Threads 抓完後立刻重新部署，讓社群版更新
  workflow_run:
    workflows: [Fetch Threads]
    types: [completed]

# 預設不給任何權限，只拿需要的
permissions: {}

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # 用第三方套件 TweeterPy 抓 Tibo 的 X 貼文：獨立成沒有寫入權限的 job，只產出 posts.json，
  # 由 deploy job 的 fetch_tibo.py 檢查後使用
  # B2 重置雷達暫停：X 從 Actions 抓不到資料，恢復時拿掉這個 job 與下方兩個步驟的 if: false
  tibo:
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch Tibo on X (TweeterPy)
        continue-on-error: true
        env:
          X_AUTH_TOKEN: ${{ secrets.X_AUTH_TOKEN }}
        run: |
          pip install -q tweeterpy==2.0.17
          timeout 4m python scripts/fetch_tibo_x.py tibo-raw/posts.json < /dev/null
      - uses: actions/upload-artifact@v4
        if: hashFiles('tibo-raw/posts.json') != ''
        with:
          name: tibo
          path: tibo-raw/posts.json
          retention-days: 1

  deploy:
    needs: tibo
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write    # 把每日存檔 commit 回 main
      actions: read      # 讀取 Fetch Threads 最近一次成功的成品
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # 這個 job 只執行本 repo 的程式與官方 actions，保留憑證以便 push 存檔
      - uses: actions/checkout@v4
      - name: Fetch Google News
        continue-on-error: true
        run: python3 scripts/fetch_news.py
      - name: Restore translation cache
        uses: actions/cache@v4
        with:
          path: cache
          key: unwind-zh-${{ github.run_id }}
          restore-keys: unwind-zh-
      - name: Fetch Unwind AI newsletter (translated to zh-TW)
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 scripts/fetch_unwind.py
      - name: Fetch AI lab blogs (translated to zh-TW)
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 scripts/fetch_ai_feeds.py
      - name: Fetch developer feeds (GitHub Trending, HN, arXiv, blogs)
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 scripts/fetch_ai_feeds.py dev-feeds.json site/dev.json cache/dev_zh.json
      - uses: actions/download-artifact@v4
        if: false
        continue-on-error: true
        with:
          name: tibo
          path: tibo-raw
      - name: Fetch Tibo on X (Codex reset radar)
        if: false
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TIBO_FEEDS: ${{ vars.TIBO_FEEDS }}
        run: python3 scripts/fetch_tibo.py
      # Threads：取 Fetch Threads 最近一次成功的結果；沒有時頁面顯示「暫時沒有資料」
      - name: Find latest Threads run
        id: threads
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id=$(gh run list -R "$GITHUB_REPOSITORY" --workflow fetch-threads.yml --status success -L 1 --json databaseId -q '.[0].databaseId')
          echo "run_id=$id" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        if: steps.threads.outputs.run_id != ''
        continue-on-error: true
        with:
          name: threads
          path: threads-raw
          run-id: ${{ steps.threads.outputs.run_id }}
          github-token: ${{ github.token }}
      - name: Sanitize Threads data
        if: hashFiles('threads-raw/threads.json') != ''
        continue-on-error: true
        run: python3 scripts/sanitize_threads.py threads-raw/threads.json site/threads.json
      - name: Fetch community events
        continue-on-error: true
        run: python3 scripts/fetch_events.py
      - name: Merge into daily archive
        run: python3 scripts/archive.py
      - name: Build newsletter
        continue-on-error: true
        run: python3 scripts/build_newsletter.py
      - name: Commit archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add archive
          if git diff --cached --quiet; then echo "存檔沒有變化"; exit 0; fi
          git commit -q -m "Archive $(TZ=Asia/Taipei date '+%F %H:%M')"
          for i in 1 2 3; do
            git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0
            sleep $((i * 5))
          done
          echo "::warning::存檔 push 失敗，下一輪會再試"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
