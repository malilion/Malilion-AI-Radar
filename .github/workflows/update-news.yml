name: Update news

on:
  schedule:
    - cron: "0 * * * *"   # 每小時整點執行一次
  workflow_dispatch:
  push:
    branches: [main]
  # Threads 抓完後立刻重新部署，讓社群版更新
  workflow_run:
    workflows: [Fetch Threads]
    types: [completed]

# 預設不給任何權限，只拿需要的
permissions: {}

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read      # 讀取 Fetch Threads 最近一次成功的成品
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 scripts/fetch_news.py
      - name: Restore translation cache
        uses: actions/cache@v4
        with:
          path: cache
          key: unwind-zh-${{ github.run_id }}
          restore-keys: unwind-zh-
      - name: Fetch Unwind AI newsletter (translated to zh-TW)
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 scripts/fetch_unwind.py
      # Threads：取 Fetch Threads 最近一次成功的結果；沒有時頁面顯示「暫時沒有資料」
      - name: Find latest Threads run
        id: threads
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id=$(gh run list -R "$GITHUB_REPOSITORY" --workflow fetch-threads.yml --status success -L 1 --json databaseId -q '.[0].databaseId')
          echo "run_id=$id" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        if: steps.threads.outputs.run_id != ''
        continue-on-error: true
        with:
          name: threads
          path: threads-raw
          run-id: ${{ steps.threads.outputs.run_id }}
          github-token: ${{ github.token }}
      - name: Sanitize Threads data
        if: hashFiles('threads-raw/threads.json') != ''
        continue-on-error: true
        run: python3 scripts/sanitize_threads.py threads-raw/threads.json site/threads.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
