name: Update news

on:
  schedule:
    - cron: "0 * * * *"   # 每小時整點執行一次
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/fetch_news.py
      - name: Restore translation cache
        uses: actions/cache@v4
        with:
          path: cache
          key: unwind-zh-${{ github.run_id }}
          restore-keys: unwind-zh-
      - name: Fetch Unwind AI newsletter (translated to zh-TW)
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 scripts/fetch_unwind.py

      # Threads 熱門：失敗時不影響新聞部署，頁面會顯示「尚無資料」
      - name: Checkout threads-toolkit
        uses: actions/checkout@v4
        with:
          repository: Chuanyin1202/threads-toolkit
          ref: a7748a8bba3e8dcae9c6ca5092aa101eb3710eb5
          path: threads-toolkit
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: threads-toolkit/package-lock.json
      - name: Fetch Threads trending
        continue-on-error: true
        working-directory: threads-toolkit
        run: |
          npm ci
          npx playwright install --with-deps chromium
          cp ../scripts/fetch_threads.mjs scripts/fetch_threads.mjs
          timeout 12m node --import tsx scripts/fetch_threads.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
