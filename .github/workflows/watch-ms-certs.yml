name: Watch Microsoft AI certifications

on:
  schedule:
    - cron: "17 1 * * 1"   # 每週一 09:17（台灣時間）
  workflow_dispatch:

permissions: {}

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Compare Microsoft Learn certification catalog
        run: python3 scripts/check_ms_certs.py --report "$RUNNER_TEMP/ms-certs-report.md"
      - name: Open an issue and save the snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f "$RUNNER_TEMP/ms-certs-report.md" ]; then
            gh issue create --title "Microsoft AI 認證目錄有變動 $(TZ=Asia/Taipei date +%F)" --body-file "$RUNNER_TEMP/ms-certs-report.md"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ms-ai-certs.json
          if git diff --cached --quiet; then echo "快照沒有變化"; exit 0; fi
          git commit -q -m "Update Microsoft AI certification snapshot"
          for i in 1 2 3; do
            git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0
            sleep $((i * 5))
          done
          echo "::warning::快照 push 失敗，下週會再比對一次"
