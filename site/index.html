<!doctype html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>台灣新聞速報</title>
<meta name="description" content="每小時自動更新的 Google 新聞（台灣）頭條">
<style>
  :root {
    --bg:#f5f6f8; --card:#fff; --fg:#1f2328; --muted:#6b7280; --line:#e5e7eb;
    --accent:#2563eb; --chip:#eef2ff; --chip-fg:#3730a3; --shadow:0 1px 2px rgba(0,0,0,.06);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:#0f1115; --card:#181b21; --fg:#e6e8eb; --muted:#9aa3af; --line:#2a2f38;
      --accent:#7aa2ff; --chip:#222a44; --chip-fg:#b7c6ff; --shadow:none;
    }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
    font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif; }
  header { background:var(--card); border-bottom:1px solid var(--line); position:sticky; top:0; z-index:10; }
  .wrap { max-width:760px; margin:0 auto; padding:0 16px; }
  .top { display:flex; align-items:baseline; justify-content:space-between; gap:12px; padding:14px 0 8px; }
  h1 { font-size:1.25rem; margin:0; letter-spacing:.02em; }
  .meta { color:var(--muted); font-size:.8rem; text-align:right; }
  .tools { display:flex; gap:8px; padding-bottom:12px; }
  input[type=search] { flex:1; min-width:0; padding:9px 12px; font:inherit; font-size:.95rem;
    color:var(--fg); background:var(--bg); border:1px solid var(--line); border-radius:10px; outline:none; }
  input[type=search]:focus { border-color:var(--accent); }
  select { padding:9px 10px; font:inherit; font-size:.95rem; color:var(--fg); background:var(--bg);
    border:1px solid var(--line); border-radius:10px; max-width:42%; }
  .tabs { display:flex; gap:4px; border-top:1px solid var(--line); }
  .tab { flex:1; padding:10px 0; font:inherit; font-size:.95rem; font-weight:600; color:var(--muted);
    background:none; border:0; border-bottom:2px solid transparent; cursor:pointer; }
  .tab[aria-selected=true] { color:var(--accent); border-bottom-color:var(--accent); }
  .kw { display:flex; flex-wrap:wrap; gap:6px; padding-bottom:12px; }
  .kw button { font:inherit; font-size:.85rem; padding:3px 12px; border-radius:999px; cursor:pointer;
    color:var(--fg); background:var(--bg); border:1px solid var(--line); }
  .kw button[aria-pressed=true] { background:var(--accent); border-color:var(--accent); color:#fff; }
  .rank { font-weight:700; color:var(--accent); margin-right:6px; }
  .body { white-space:pre-wrap; word-break:break-word; margin-top:4px; }
  .hot { margin-bottom:18px; }
  .hot h2 { font-size:1rem; margin:0 0 10px; }
  .hot ol li { border-left:4px solid var(--accent); }
  .hot .no { display:inline-flex; align-items:center; justify-content:center; width:1.6em; height:1.6em; margin-right:8px;
    border-radius:50%; background:var(--accent); color:#fff; font-size:.85rem; font-weight:700; }
  .hot .title { font-size:1.08rem; }
  main { padding:16px 0 48px; }
  ol { list-style:none; margin:0; padding:0; display:grid; gap:10px; }
  li { background:var(--card); border:1px solid var(--line); border-radius:12px; box-shadow:var(--shadow); transition:transform .12s, border-color .12s; }
  li:hover { border-color:var(--accent); transform:translateY(-1px); }
  li a { display:block; padding:14px 16px; color:inherit; text-decoration:none; }
  .title { font-weight:600; line-height:1.5; }
  .sub { display:flex; flex-wrap:wrap; align-items:center; gap:8px; margin-top:8px; font-size:.8rem; color:var(--muted); }
  .chip { background:var(--chip); color:var(--chip-fg); padding:1px 9px; border-radius:999px; font-weight:500; }
  .empty, .count { text-align:center; color:var(--muted); font-size:.85rem; padding:12px 0; }
  .count { text-align:left; padding:0 0 10px; }
  footer { text-align:center; color:var(--muted); font-size:.75rem; padding:0 0 32px; }
  footer a { color:inherit; }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="top">
      <h1>📰 台灣新聞速報</h1>
      <div class="meta" id="meta">載入中…</div>
    </div>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" id="tab-news" aria-selected="true">新聞</button>
      <button class="tab" role="tab" id="tab-threads" aria-selected="false">Threads 熱門</button>
    </div>
    <div class="tools" id="newsTools" style="padding-top:12px">
      <input type="search" id="q" placeholder="搜尋標題…" aria-label="搜尋標題">
      <select id="src" aria-label="依媒體篩選"><option value="">全部媒體</option></select>
    </div>
    <div class="kw" id="kw" hidden></div>
  </div>
</header>
<main class="wrap">
  <div class="count" id="count"></div>
  <section class="hot" id="hot" hidden><h2>🔥 最熱門 Top 3</h2><ol id="hotList"></ol></section>
  <ol id="list"></ol>
  <div class="empty" id="empty" hidden>找不到符合的新聞</div>
</main>
<footer id="foot">資料來源：<a href="https://news.google.com/?hl=zh-TW&gl=TW&ceid=TW:zh-Hant" target="_blank" rel="noopener">Google 新聞</a> · 每小時自動更新</footer>
<script>
const $ = id => document.getElementById(id);
let items = [];

function ago(s) {
  const t = new Date(s); if (isNaN(t)) return s || '';
  const m = Math.round((Date.now() - t) / 60000);
  if (m < 1) return '剛剛';
  if (m < 60) return m + ' 分鐘前';
  if (m < 1440) return Math.floor(m / 60) + ' 小時前';
  if (m < 10080) return Math.floor(m / 1440) + ' 天前';
  return t.toLocaleDateString('zh-TW');
}

function card(it, rank) {
    const li = document.createElement('li');
    const a = document.createElement('a');
    a.href = it.link; a.target = '_blank'; a.rel = 'noopener';
    const title = document.createElement('div');
    title.className = 'title';
    if (rank) { const n = document.createElement('span'); n.className = 'no'; n.textContent = rank; title.append(n); }
    title.append(it.title);
    const sub = document.createElement('div'); sub.className = 'sub';
    if (it.source) { const c = document.createElement('span'); c.className = 'chip'; c.textContent = it.source; sub.append(c); }
    const time = document.createElement('span'); time.textContent = ago(it.pubDate); sub.append(time);
    a.append(title, sub); li.append(a);
    return li;
}

function render() {
  const q = $('q').value.trim().toLowerCase(), src = $('src').value;
  const list = $('list'); list.textContent = '';
  $('hotList').textContent = '';
  // Google 新聞 RSS 依熱度排序，前 3 則視為最熱門；搜尋或篩選時不顯示此區塊
  const showHot = !q && !src && items.length > 3;
  $('hot').hidden = !showHot || tab !== 'news';
  if (showHot) items.slice(0, 3).forEach((it, i) => $('hotList').append(card(it, i + 1)));
  const shown = items.filter(i => (!src || i.source === src) && (!q || i.title.toLowerCase().includes(q)));
  (showHot ? shown.slice(3) : shown).forEach(it => list.append(card(it)));
  $('count').textContent = `共 ${shown.length} 則`;
  $('empty').hidden = shown.length > 0;
}

fetch('news.json', { cache: 'no-cache' }).then(r => r.json()).then(d => {
  // 標題結尾的「 - 媒體名稱」已顯示在標籤上，去掉避免重複
  items = d.items.map(i => {
    const suffix = i.source ? ' - ' + i.source : '';
    const title = suffix && i.title.endsWith(suffix) ? i.title.slice(0, -suffix.length) : i.title;
    return { ...i, title };
  });
  const u = new Date(d.updated);
  $('meta').textContent = '更新於 ' + (isNaN(u) ? d.updated : u.toLocaleString('zh-TW', { month:'numeric', day:'numeric', hour:'2-digit', minute:'2-digit' }));
  for (const s of [...new Set(items.map(i => i.source).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'zh-TW'))) {
    const o = document.createElement('option'); o.value = o.textContent = s; $('src').append(o);
  }
  render();
}).catch(() => { $('meta').textContent = '載入失敗'; });

// ---- Threads 熱門 ----
let tdata = null, tkw = '', tab = 'news';

function num(n) { return n >= 10000 ? (n / 10000).toFixed(1) + ' 萬' : String(n || 0); }

function renderThreads() {
  $('hot').hidden = true;
  const list = $('list'); list.textContent = '';
  $('kw').textContent = '';
  if (!tdata || !tdata.groups) {
    $('count').textContent = '';
    $('empty').textContent = 'Threads 尚無資料（可能被 Threads 擋下，下次更新會再試）';
    $('empty').hidden = false; return;
  }
  const groups = tdata.groups.filter(g => g.posts.length);
  const mk = (label, val) => {
    const b = document.createElement('button');
    b.textContent = label; b.setAttribute('aria-pressed', String(tkw === val));
    b.onclick = () => { tkw = val; renderThreads(); }; $('kw').append(b);
  };
  mk('全部', '');
  groups.forEach(g => mk(g.keyword, g.keyword));
  const q = $('q').value.trim().toLowerCase();
  const posts = groups.filter(g => !tkw || g.keyword === tkw)
    .flatMap(g => g.posts.map(p => ({ ...p, keyword: g.keyword })))
    .filter((p, i, a) => a.findIndex(x => x.id === p.id) === i)
    .filter(p => !q || (p.content + p.username).toLowerCase().includes(q))
    .sort((a, b) => tdata.sort === 'latest'
      ? (Date.parse(b.timestamp) || 0) - (Date.parse(a.timestamp) || 0) : b.score - a.score);
  posts.forEach((p, i) => {
    const li = document.createElement('li'), a = document.createElement('a');
    a.href = p.url; a.target = '_blank'; a.rel = 'noopener';
    const head = document.createElement('div'); head.className = 'title';
    const r = document.createElement('span'); r.className = 'rank'; r.textContent = '#' + (i + 1);
    head.append(r, '@' + p.username);
    const body = document.createElement('div'); body.className = 'body';
    body.textContent = p.content.length > 280 ? p.content.slice(0, 280) + '…' : p.content;
    const sub = document.createElement('div'); sub.className = 'sub';
    const c = document.createElement('span'); c.className = 'chip'; c.textContent = p.keyword; sub.append(c);
    const st = p.stats || {};
    const t = document.createElement('span');
    t.textContent = `❤ ${num(st.likes)} · 💬 ${num(st.replies)} · 🔁 ${num(st.reposts)} · ${ago(p.timestamp)}`;
    sub.append(t); a.append(head, body, sub); li.append(a); list.append(li);
  });
  $('count').textContent = `共 ${posts.length} 則（${tdata.note || ''}）`;
  $('empty').textContent = '找不到符合的貼文'; $('empty').hidden = posts.length > 0;
  const u = new Date(tdata.updated);
  $('meta').textContent = '更新於 ' + (isNaN(u) ? '' : u.toLocaleString('zh-TW', { month:'numeric', day:'numeric', hour:'2-digit', minute:'2-digit' }));
}

function setTab(t) {
  tab = t;
  $('tab-news').setAttribute('aria-selected', String(t === 'news'));
  $('tab-threads').setAttribute('aria-selected', String(t === 'threads'));
  $('src').hidden = t !== 'news';
  $('kw').hidden = t !== 'threads';
  $('q').placeholder = t === 'news' ? '搜尋標題…' : '搜尋貼文或帳號…';
  $('empty').textContent = '找不到符合的新聞';
  if (t === 'news') { $('kw').textContent = ''; render(); return; }
  if (tdata !== null) { renderThreads(); return; }
  $('count').textContent = '載入中…'; $('list').textContent = '';
  fetch('threads.json', { cache: 'no-cache' }).then(r => r.ok ? r.json() : false)
    .catch(() => false).then(d => { tdata = d; if (tab === 'threads') renderThreads(); });
}
$('tab-news').onclick = () => setTab('news');
$('tab-threads').onclick = () => setTab('threads');

$('q').addEventListener('input', () => tab === 'news' ? render() : renderThreads());
$('src').addEventListener('change', render);
</script>
</body>
</html>
